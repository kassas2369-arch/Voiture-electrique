function calcSavings(){
var km=parseInt($("kmYear").value);
var gp=parseFloat($("gasPrice").value);
var gc=parseFloat($("gasCons").value);
var ev=parseFloat($("evCons").value);
var ep=parseFloat($("elecPrice").value);
var wb=window.wallboxCost||3500;
$("kmYearV").textContent=km.toLocaleString();
$("gasPriceV").textContent=gp.toFixed(1);
$("gasConsV").textContent=gc.toFixed(1);
$("evConsV").textContent=ev;
$("elecPriceV").textContent=ep.toFixed(2);
// التكاليف
var gasCost=km*gc/100*gp;
var elecCost=km*ev/100*ep;
var save=gasCost-elecCost;
var savePer100=gc*gp-ev*ep;
var savePercent=Math.round(save/gasCost*100);
// فترة التعويض
var priceDiff=25000+wb;
var bonus=10000;
var netDiff=priceDiff-bonus;
var yearsToPayback=netDiff/save;

'<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px">'+
'<div style="background:rgba(255,158,0,0.1);padding:6px;border-radius:6px;text-align:center;border:1px solid #ff9e00"><div style="font-size:9px;color:#8b92b8">⛽ بنزين/سنة</div><div style="font-size:14px;font-weight:800;color:#ff9e00">'+gasCost.toFixed(0).toLocaleString()+' د.ت</div></div>'+

'</div>'+
'<div style="background:rgba(0,217,126,0.15);padding:8px;border-radius:6px;text-align:center;border:1px solid #00d97e;margin-bottom:8px">'+

$("breakevenResult").innerHTML=

'<div style="font-size:10px;color:#8b92b8">⏱️ فترة استرداد الفرق</div>'+
'<div style="font-size:18px;font-weight:800;color:#00d97e">'+(yearsToPayback>0?yearsToPayback.toFixed(1):'∞')+' سنوات</div>'+

function copyToClipboard(data){
var text=data.text+"\n\n🔗 "+data.url;
if(navigator.clipboard){
navigator.clipboard.writeText(text).then(function(){showToast("✅ تم نسخ النص! الصقه في WhatsApp")}).catch(function(){fallbackCopy(text)});
}else{
fallbackCopy(text);
}
}
function fallbackCopy(text){
var ta=document.createElement("textarea");
ta.value=text;
ta.style.position="fixed";
ta.style.opacity="0";
document.body.appendChild(ta);
ta.select();
try{document.execCommand("copy");showToast("✅ تم نسخ النص!")}catch(e){showToast("❌ لم نتمكن من النسخ")}
document.body.removeChild(ta);
}
function showToast(msg){
var t=document.createElement("div");
t.textContent=msg;
t.style.cssText="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#00d97e;color:#0a0e27;padding:10px 20px;border-radius:8px;font-weight:800;font-size:13px;z-index:9999;box-shadow:0 4px 20px rgba(0,217,126,0.4);animation:slideUp 0.3s ease-out";
document.body.appendChild(t);
setTimeout(function(){t.style.opacity="0";t.style.transition="opacity 0.3s";setTimeout(function(){document.body.removeChild(t)},300)},2500);
}
